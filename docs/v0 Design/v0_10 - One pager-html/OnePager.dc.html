<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Photography</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,300&amp;family=Instrument+Sans:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#E7E5E0}
a{color:#1C1C1A;text-decoration:none}a:hover{color:#5E5B55}
.jg{--rh:220px;gap:10px}
@media (max-width:640px){.jg{--rh:110px;gap:5px}}
.jg button{transition:opacity .4s ease}
.jg button:hover{opacity:.78}
.jg button:focus-visible,.lbbtn:focus-visible,.cbtn:focus-visible{outline:1px solid #1C1C1A;outline-offset:3px}
.lbbtn{background:none;border:0;color:#1C1C1A;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;opacity:.7;transition:opacity .3s ease}
.lbbtn:hover{opacity:1}
.cbtn:hover{color:#1C1C1A}
</style>
</helmet>
<div id="top" style="background: {{ground}}; color: #1C1C1A; font-family: 'Instrument Sans', system-ui, sans-serif; min-height: 100vh">
  <div style="max-width: 1360px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 64px)">

    <header style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 32px; padding: 28px 0">
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px">
        <a href="https://www.govindarampingali.com" style="display: flex; align-items: center; min-height: 44px; font-family: 'Newsreader', serif; font-size: 19px; font-weight: 400; letter-spacing: 0.01em">Govinda Ram Pingali</a>
        <span aria-hidden="true" style="font-family: 'Newsreader', serif; font-size: 22px; font-weight: 300; color: #A8A49C">/</span>
        <a href="#top" aria-current="page" style="display: flex; align-items: center; min-height: 44px; font-family: 'Newsreader', serif; font-style: italic; font-size: 19px; font-weight: 300">Photography</a>
      </div>
      <div style="position: relative">
        <button type="button" class="cbtn" aria-expanded="{{contactExpanded}}" aria-controls="contact-pop" onClick="{{toggleContact}}" style="font: inherit; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #3D3B37; background: none; border: 0; padding: 0; min-height: 44px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px">Contact
          <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true" style="{{chevronStyle}}"><path d="M1 1l4 4 4-4"></path></svg>
        </button>
        <sc-if value="{{contactOpen}}" hint-placeholder-val="{{ false }}">
          <div id="contact-pop" style="position: absolute; right: 0; top: calc(100% + 4px); z-index: 10; background: {{ground}}; border: 1px solid #CBC8C1; box-shadow: 0 10px 30px rgba(28, 28, 26, 0.07); padding: 12px 20px; display: flex; flex-direction: column; white-space: nowrap">
            <a href="mailto:govinda@pgr.earth" style="font-family: 'Newsreader', serif; font-size: 20px; font-weight: 300; min-height: 36px; display: flex; align-items: center; border-bottom: 1px solid #CBC8C1">govinda@pgr.earth</a>
          </div>
        </sc-if>
      </div>
    </header>

    <h1 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px">Photography by Govinda Ram Pingali</h1>
    <div aria-hidden="true" style="height: clamp(48px, 7vw, 96px)"></div>

    <main style="display: flex; flex-direction: column; padding-bottom: clamp(64px, 8vw, 112px)">
      <sc-for list="{{sections}}" as="sec" hint-placeholder-count="6">
        <section id="{{sec.id}}" aria-label="{{sec.title}}" style="display: flex; flex-direction: column; gap: 24px; padding: 28px 0 clamp(48px, 6vw, 80px); border-top: 1px solid #CBC8C1">
          <div style="display: flex; align-items: baseline; gap: 20px">
            <span style="font-size: 12px; color: #5E5B55; font-variant-numeric: tabular-nums">{{sec.num}}</span>
            <h2 style="margin: 0; font-family: 'Newsreader', serif; font-size: clamp(24px, 2.4vw, 30px); font-weight: 300; flex-grow: 1">{{sec.title}}</h2>
            <span style="font-size: 12px; letter-spacing: 0.06em; color: #5E5B55">{{sec.count}}</span>
          </div>
          <div class="jg" style="display: flex; flex-wrap: wrap">
            <sc-for list="{{sec.photos}}" as="ph" hint-placeholder-count="6">
              <button type="button" aria-label="{{ph.label}}" onClick="{{ph.open}}" style="{{ph.style}}"></button>
            </sc-for>
            <span aria-hidden="true" style="flex: 100000 1 0px; height: 0"></span>
          </div>
        </section>
      </sc-for>
    </main>

    <footer style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; padding: 24px 0 40px; border-top: 1px solid #CBC8C1; font-size: 12px; letter-spacing: 0.04em; color: #5E5B55">
      <span>© 2026 Govinda Ram Pingali</span>
      <span><a href="https://www.govindarampingali.com" style="color: #5E5B55">govindarampingali.com</a> / <a href="#top" style="color: #1C1C1A">photography</a></span>
      <a href="#top" style="color: #5E5B55; min-height: 44px; display: inline-flex; align-items: center; gap: 8px">Back to top
        <svg width="10" height="12" viewBox="0 0 10 12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M5 12V1M1 5l4-4 4 4"></path></svg>
      </a>
    </footer>

  </div>

  <sc-if value="{{isOpen}}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-modal="true" aria-label="{{lbLabel}}" style="position: fixed; inset: 0; z-index: 20; background: {{ground}}; display: flex; flex-direction: column; padding: clamp(12px, 3vw, 32px); box-sizing: border-box">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px">
        <span style="display: flex; align-items: baseline; gap: 14px; padding-left: 4px">
          <span style="font-family: 'Newsreader', serif; font-size: 18px; font-weight: 300">{{lbTitle}}</span>
          <span style="font-size: 12px; letter-spacing: 0.14em; color: #5E5B55; font-variant-numeric: tabular-nums">{{counter}}</span>
        </span>
        <button type="button" class="lbbtn" aria-label="Close viewer" onClick="{{close}}">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M2 2l14 14M16 2L2 16"></path></svg>
        </button>
      </div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: clamp(4px, 2vw, 24px); min-height: 0">
        <button type="button" class="lbbtn" aria-label="Previous photo" onClick="{{prev}}">
          <svg width="12" height="22" viewBox="0 0 12 22" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M11 1L1 11l10 10"></path></svg>
        </button>
        <div style="flex-grow: 1; min-width: 0; display: flex; align-items: center; justify-content: center; height: 100%">
          <div style="{{lbStyle}}"></div>
        </div>
        <button type="button" class="lbbtn" aria-label="Next photo" onClick="{{next}}">
          <svg width="12" height="22" viewBox="0 0 12 22" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true"><path d="M1 1l10 10L1 21"></path></svg>
        </button>
      </div>
      <div style="min-height: 44px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px 14px; font-size: 12px; letter-spacing: 0.06em; color: #5E5B55; text-align: center">
        <span style="color: #3D3B37">{{lbLocation}}</span>
        <span aria-hidden="true" style="color: #A8A49C">|</span>
        <span style="font-variant-numeric: tabular-nums">{{lbDate}}</span>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ground":{"editor":"color","default":"#E7E5E0","options":["#E7E5E0","#EAE8E3","#E2E0DA","#EDEBE7"]},"$preview":{"width":1440,"height":3400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sec: null, idx: 0, contact: false };
  }
  renderVals() {
    // One list drives the whole page. Each section: id, title, and its frames (aspect ratio, location, date).
    const L = 'Kavanapura, KA, India';
    const D = 'June 2026';
    const mk = (ars) => ars.map((ar) => ({ ar: ar, location: L, date: D }));
    const DATA = [
      { id: 'people', title: 'People', photos: mk([0.8, 0.667, 1.5, 0.8, 1, 0.667, 1.5, 0.8]) },
      { id: 'gatherings', title: 'Gatherings', photos: mk([1.5, 1.5, 0.8, 1.778, 1.5]) },
      { id: 'structures', title: 'Structures', photos: mk([1.5, 0.8, 1.5, 0.667, 1.5, 1]) },
      { id: 'land', title: 'Land', photos: mk([1.778, 1.5, 0.8, 1.5, 1.5, 0.667, 1.5]) },
      { id: 'textures', title: 'Textures', photos: mk([1, 1.5, 0.8, 1.5, 0.667, 1.5]) },
      { id: 'shot-on-iphone', title: 'Shot on iPhone', photos: mk([0.75, 1.333, 0.75, 0.75, 1.333, 1.778, 0.75, 1.333]) }
    ];
    const TONES = ['#D3D0C9', '#CAC6BE', '#D8D5CF', '#C4C0B7', '#CFCBC4'];
    const pad = (x) => String(x).padStart(2, '0');
    const ground = this.props.ground ?? '#E7E5E0';

    const sections = DATA.map((s, si) => ({
      id: s.id,
      num: pad(si + 1),
      title: s.title,
      count: s.photos.length + ' frames',
      photos: s.photos.map((p, pi) => ({
        label: 'Open ' + s.title + ', photo ' + (pi + 1) + ' of ' + s.photos.length,
        style: 'flex: ' + Math.round(p.ar * 100) + ' 1 calc(' + p.ar + ' * var(--rh)); aspect-ratio: ' + p.ar + '; background: ' + TONES[(si + pi) % 5] + '; border: 0; padding: 0; margin: 0; min-width: 0; cursor: zoom-in',
        open: () => this.setState({ sec: si, idx: pi, contact: false })
      }))
    }));

    const sec = this.state.sec;
    const isOpen = sec !== null && sec !== undefined;
    const s = isOpen ? DATA[sec] : null;
    const n = isOpen ? s.photos.length : 1;
    const idx = this.state.idx;
    const cur = isOpen ? s.photos[idx] : { ar: 1, location: '', date: '' };
    const contactOpen = !!this.state.contact;

    return {
      ground,
      sections,
      contactOpen,
      contactExpanded: contactOpen ? 'true' : 'false',
      chevronStyle: contactOpen ? 'transform: rotate(180deg); transition: transform .25s ease' : 'transition: transform .25s ease',
      toggleContact: () => this.setState({ contact: !contactOpen }),
      isOpen,
      lbTitle: isOpen ? s.title : '',
      lbLabel: isOpen ? s.title + ' viewer' : 'Photo viewer',
      counter: isOpen ? pad(idx + 1) + ' / ' + pad(n) : '',
      lbLocation: cur.location,
      lbDate: cur.date,
      lbStyle: 'width: min(100%, calc((100vh - 170px) * ' + cur.ar + ')); aspect-ratio: ' + cur.ar + '; background: ' + (isOpen ? TONES[(sec + idx) % 5] : '#CFCBC4'),
      close: () => this.setState({ sec: null, idx: 0 }),
      prev: () => this.setState({ idx: (idx - 1 + n) % n }),
      next: () => this.setState({ idx: (idx + 1) % n })
    };
  }
}
</script>
</body>
</html>
